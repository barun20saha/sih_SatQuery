# ============================================================
# SatQuery API Gateway — Application Properties
# ============================================================

server.port=8080
spring.application.name=satquery-gateway

# Python FastAPI backend target URL
satquery.backend.url=http://localhost:8000

# CORS — add your production domain here if deploying
satquery.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# Allow large multipart uploads (satellite images can be large)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Spring Boot 3.x: dispatch OPTIONS preflight requests to controllers
# (needed for CORS preflight to work through the proxy controller)
spring.mvc.dispatch-options-request=true

# Spring Boot 3.x: disable trailing slash match (avoids NoResourceFoundException)
spring.mvc.pathmatch.use-suffix-pattern=false

# Suppress Spring Boot favicon 404 noise
spring.mvc.static-path-pattern=/static/**
spring.web.resources.add-mappings=false

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.satquery=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss} [%highlight(%-5level)] %cyan(%logger{20}) - %msg%n
